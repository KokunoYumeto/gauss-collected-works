# The Gauss site: builds docs/index.html with site/build_site.py, fetches the newest reader PDFs from the releases into
# docs/pdf/ (served in the browser as "Read online"; never committed), and deploys docs/ to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ["README.md", "site/**", "docs/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page and fetch the PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B site/build_site.py --fetch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
